<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="at ad" xmlns:c2pa="http://c2pa.org/manifest"><title id="at">How the app talks to its database</title><desc id="ad">A request travels from the Windows Forms UI through DBHelper to PharmacyDB and the result flows back.</desc><rect width="900" height="340" rx="18" fill="#0e3b3a"/><rect x="40" y="60" width="210" height="150" rx="14" fill="#7fe3be" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0.25;0;0" keyTimes="0;0.86;0.875;0.95;0.965;1" dur="7s" repeatCount="indefinite"/></rect><rect x="345" y="60" width="210" height="150" rx="14" fill="#ffd166" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0.25;0;0" keyTimes="0;0.22;0.235;0.3;0.315;1" dur="7s" repeatCount="indefinite"/></rect><rect x="345" y="60" width="210" height="150" rx="14" fill="#ffd166" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0.25;0;0" keyTimes="0;0.66;0.675;0.72;0.735;1" dur="7s" repeatCount="indefinite"/></rect><rect x="650" y="60" width="210" height="150" rx="14" fill="#ff7b6b" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0.25;0;0" keyTimes="0;0.44;0.455;0.52;0.535;1" dur="7s" repeatCount="indefinite"/></rect><rect x="40" y="60" width="210" height="150" rx="14" fill="#134947" stroke="#7fe3be" stroke-width="2" fill-opacity="0.9"/><text x="145" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#f2fbf8">Windows Forms UI</text><text x="145" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">LoginForm, RegisterForm</text><text x="145" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">Customer, Pharmacist, Admin</text><text x="145" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">dashboards</text><rect x="345" y="60" width="210" height="150" rx="14" fill="#134947" stroke="#ffd166" stroke-width="2" fill-opacity="0.9"/><text x="450" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#f2fbf8">DBHelper</text><text x="450" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">SqlConnection</text><text x="450" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">SqlCommand</text><text x="450" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">SqlDataAdapter</text><rect x="650" y="60" width="210" height="150" rx="14" fill="#134947" stroke="#ff7b6b" stroke-width="2" fill-opacity="0.9"/><text x="755" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#f2fbf8">PharmacyDB</text><text x="755" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">SQL Server LocalDB</text><text x="755" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">MSSQLLocalDB</text><text x="755" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#9cc9c0">7 tables</text><line x1="256" y1="122" x2="339" y2="122" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="256" y1="148" x2="339" y2="148" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="561" y1="122" x2="644" y2="122" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="561" y1="148" x2="644" y2="148" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="3 5"/><g opacity="0"><animateMotion path="M 256 122 L 339 122" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.22;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.09;0.22;0.23;1" dur="7s" repeatCount="indefinite"/><circle r="10" fill="#ff7b6b" opacity="0.25"/><circle r="5" fill="#ff7b6b"/></g><g opacity="0"><animateMotion path="M 561 122 L 644 122" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.44;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.44;0.45;1" dur="7s" repeatCount="indefinite"/><circle r="10" fill="#ff7b6b" opacity="0.25"/><circle r="5" fill="#ff7b6b"/></g><g opacity="0"><animateMotion path="M 644 148 L 561 148" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.66;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.53;0.66;0.67;1" dur="7s" repeatCount="indefinite"/><circle r="10" fill="#7fe3be" opacity="0.25"/><circle r="5" fill="#7fe3be"/></g><g opacity="0"><animateMotion path="M 339 148 L 256 148" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.86;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.73;0.86;0.87;1" dur="7s" repeatCount="indefinite"/><circle r="10" fill="#7fe3be" opacity="0.25"/><circle r="5" fill="#7fe3be"/></g><text x="450" y="290" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f2fbf8" opacity="0">1. A form asks DBHelper for data<animate attributeName="opacity" values="1;0" keyTimes="0;0.3" dur="7s" repeatCount="indefinite" calcMode="discrete"/></text><text x="450" y="290" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f2fbf8" opacity="0">2. DBHelper sends the SQL to PharmacyDB<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.52" dur="7s" repeatCount="indefinite" calcMode="discrete"/></text><text x="450" y="290" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f2fbf8" opacity="0">3. The result flows back to the screen<animate attributeName="opacity" values="0;1" keyTimes="0;0.52" dur="7s" repeatCount="indefinite" calcMode="discrete"/></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
