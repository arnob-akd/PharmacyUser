<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><title id="bt">Pharmacy Management System</title><desc id="bd">Animated banner with a heartbeat line, floating capsules and a pulsing medical cross.</desc><defs><radialGradient id="g" gradientUnits="userSpaceOnUse" cx="1030" cy="130" r="320"><stop offset="0" stop-color="#7fe3be" stop-opacity="0.22"/><stop offset="1" stop-color="#7fe3be" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="320" rx="18" fill="#0e3b3a"/><rect width="1200" height="320" rx="18" fill="url(#g)"/><circle cx="1030" cy="130" r="86" fill="none" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 1030 130" to="360 1030 130" dur="40s" repeatCount="indefinite"/></circle><g transform="translate(1030 130)"><g><animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.6s" repeatCount="indefinite"/><rect x="-11" y="-39" width="22" height="78" rx="5" fill="#7fe3be"/><rect x="-39" y="-11" width="78" height="22" rx="5" fill="#7fe3be"/></g></g><g transform="translate(905 72) rotate(-28) scale(1.5)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" begin="0s" repeatCount="indefinite"/><path d="M0 -12 H-16 A12 12 0 0 0 -16 12 H0 Z" fill="#ff7b6b"/><path d="M0 -12 H16 A12 12 0 0 1 16 12 H0 Z" fill="#f2fbf8"/></g></g><g transform="translate(1128 228) rotate(24) scale(1.5)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4.1s" begin="-1.2s" repeatCount="indefinite"/><path d="M0 -12 H-16 A12 12 0 0 0 -16 12 H0 Z" fill="#ffd166"/><path d="M0 -12 H16 A12 12 0 0 1 16 12 H0 Z" fill="#f2fbf8"/></g></g><g transform="translate(930 236) rotate(12) scale(1.5)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.7s" begin="-2.1s" repeatCount="indefinite"/><path d="M0 -12 H-16 A12 12 0 0 0 -16 12 H0 Z" fill="#7fe3be"/><path d="M0 -12 H16 A12 12 0 0 1 16 12 H0 Z" fill="#f2fbf8"/></g></g><text x="64" y="120" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#f2fbf8" letter-spacing="-0.5">Pharmacy Management System</text><text x="66" y="162" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#9cc9c0">A desktop app built with C# Windows Forms and SQL Server LocalDB</text><text x="66" y="222" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#7fe3be" opacity="0">Customers browse medicines and place orders<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0417;0.2917;0.3333;1" dur="12s" repeatCount="indefinite"/></text><text x="66" y="222" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#ffd166" opacity="0">Pharmacists manage stock, orders and prescriptions<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.375;0.625;0.6667;1" dur="12s" repeatCount="indefinite"/></text><text x="66" y="222" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#ff7b6b" opacity="0">Admins control everything and read the reports<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6667;0.7083;0.9583;1" dur="12s" repeatCount="indefinite"/></text><path d="M64 284 L104 284 L114 276 L124 284 L154 284 L162 290 L172 238 L182 302 L190 284 L214 284 L229 272 L244 284 L278 284 L318 284 L328 276 L338 284 L368 284 L376 290 L386 238 L396 302 L404 284 L428 284 L443 272 L458 284 L49