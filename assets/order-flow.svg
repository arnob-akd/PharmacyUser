<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="ft fd" xmlns:c2pa="http://c2pa.org/manifest"><title id="ft">Order and prescription lifecycle</title><desc id="fd">A token moves an order from Pending to Processing to Delivered, and a prescription from Uploaded to Pending to Approved or Rejected.</desc><rect width="960" height="330" rx="18" fill="#0e3b3a"/><text x="24" y="105" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#f2fbf8">Order</text><line x1="342" y1="100" x2="448" y2="100" stroke="#2a6b66" stroke-width="2" stroke-dasharray="4 6"/><line x1="632" y1="100" x2="738" y2="100" stroke="#2a6b66" stroke-width="2" stroke-dasharray="4 6"/><rect x="165" y="78" width="170" height="44" rx="12" fill="#134947" stroke="#2a6b66" stroke-width="1.5"/><rect x="165" y="78" width="170" height="44" rx="12" fill="#7fe3be" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.02;0.035;0.95;0.965;1" dur="10s" repeatCount="indefinite"/></rect><text x="250" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f2fbf8">Pending</text><rect x="455" y="78" width="170" height="44" rx="12" fill="#134947" stroke="#2a6b66" stroke-width="1.5"/><rect x="455" y="78" width="170" height="44" rx="12" fill="#7fe3be" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.28;0.295;0.95;0.965;1" dur="10s" repeatCount="indefinite"/></rect><text x="540" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f2fbf8">Processing</text><rect x="745" y="78" width="170" height="44" rx="12" fill="#134947" stroke="#2a6b66" stroke-width="1.5"/><rect x="745" y="78" width="170" height="44" rx="12" fill="#7fe3be" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.62;0.635;0.95;0.965;1" dur="10s" repeatCount="indefinite"/></rect><text x="830" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f2fbf8">Delivered</text><g opacity="0"><animateMotion path="M 250 100 L 830 100" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.5;0.5;1;1" keyTimes="0;0.08;0.28;0.42;0.62;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.9;0.95;1" dur="10s" repeatCount="indefinite"/><g transform="translate(0 0) rotate(0) scale(0.9)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="2s" begin="0s" repeatCount="indefinite"/><path d="M0 -12 H-16 A12 12 0 0 0 -16 12 H0 Z" fill="#ff7b6b"/><path d="M0 -12 H16 A12 12 0 0 1 16 12 H0 Z" fill="#f2fbf8"/></g></g></g><text x="480" y="150" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9cc9c0">The customer places an order, the pharmacist or admin moves it forward</text><text x="24" y="240" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#f2fbf8">Prescription</text><line x1="342" y1="235" x2="448" y2="235" stroke="#2a6b66" stroke-width="2" stroke-dasharray="4 6"/><line x1="632" y1="235" x2="738" y2="235" stroke="#2a6b66" stroke-width="2" stroke-dasharray="4 6"/><rect x="165" y="213" width="170" height="44" rx="12" fill="#134947" stroke="#2a6b66" stroke-width="1.5"/><rect x="165" y="213" width="170" height="44" rx="12" fill="#7fe3be" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.12;0.135;0.95;0.965;1" dur="10s" repeatCount="indefinite"/></rect><text x="250" y="240" text-anchor="middle" font-family="'